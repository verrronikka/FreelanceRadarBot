services:
  postgres:
    image: postgres:16-alpine
    container_name: fr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelanceradar
      POSTGRES_USER: fr_user
      POSTGRES_PASSWORD: fr_password
    ports:
      - "127.0.0.1:5432:5432"   # только локально — БД закрыта из интернета
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fr_user -d freelanceradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fr_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Бот в контейнере (для VPS). Локально на Windows удобнее запускать python -m bot.main.
  # Запуск: docker compose --profile bot up -d --build
  bot:
    profiles: ["bot"]
    build: .
    container_name: fr_bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fr_user:fr_password@postgres:5432/freelanceradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "bot.healthcheck", "--quiet"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
